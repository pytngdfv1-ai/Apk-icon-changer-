name: Cambiar ícono del APK

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Ruta del APK dentro del repo"
        required: true
        default: "input/app.apk"
      icon_path:
        description: "Ruta del ícono nuevo (PNG cuadrado, ideal 1024x1024)"
        required: true
        default: "input/icon.png"

jobs:
  change-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verificar que el APK subido es válido
        run: |
          if [ ! -f "${{ inputs.apk_path }}" ]; then
            echo "::error::No se encontró el archivo en '${{ inputs.apk_path }}'. Revisa la ruta."
            exit 1
          fi
          if ! unzip -tq "${{ inputs.apk_path }}" > /dev/null 2>&1; then
            echo "::error::El archivo '${{ inputs.apk_path }}' no es un ZIP/APK válido (está corrupto o no se subió correctamente). Verifica que abra como .zip en tu PC y vuelve a subirlo con git add/commit/push (no con el uploader web), revisando que no tengas core.autocrlf activado."
            exit 1
          fi
          echo "APK válido."

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK (build-tools + zipalign + apksigner)
        uses: android-actions/setup-android@v3

      - name: Instalar apktool (última versión) e ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick unzip
          JAR_URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          echo "Descargando: $JAR_URL"
          sudo curl -sL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o /usr/local/bin/apktool
          sudo curl -sL "$JAR_URL" -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Detectar aapt2 del SDK de Android
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "AAPT2_PATH=$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" >> "$GITHUB_ENV"

      - name: Decompilar APK
        run: apktool d -f "${{ inputs.apk_path }}" -o decoded

      - name: Generar íconos en todas las densidades y reemplazarlos
        run: |
          bash scripts/replace_icon.sh "${{ inputs.icon_path }}" decoded

      - name: Recompilar APK
        run: apktool b decoded -o app-unsigned.apk

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 app-unsigned.apk app-aligned.apk

      - name: Crear keystore de firma (si no existe uno propio en el repo)
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/release.jks \
              -alias iconchanger -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass changeit -keypass changeit \
              -dname "CN=IconChanger, OU=IconChanger, O=IconChanger, L=NA, S=NA, C=US"
          fi

      - name: Firmar APK
        run: |
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks keystore/release.jks --ks-pass pass:changeit \
            --out app-final-signed.apk app-aligned.apk

      - name: Verificar firma
        run: |
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose app-final-signed.apk

      - name: Subir APK resultante
        uses: actions/upload-artifact@v4
        with:
          name: apk-con-nuevo-icono
          path: app-final-signed.apk
